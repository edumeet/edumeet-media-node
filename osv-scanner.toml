# Advisories ignored by OSV-Scanner. Every entry must say why it does not
# affect the media node and carry an ignoreUntil date so it gets re-checked.
#
# The running media node never loads glob, minimatch or picomatch. A production
# install does contain them, but only as build tools: Yarn adds node-gyp to
# compile the native addons bufferutil and utf-8-validate, and node-gyp brings
# glob (via make-fetch-happen > cacache) with its minimatch, and picomatch (via
# tinyglobby). They run only at install time, with node-gyp's own patterns. All
# other users are build, test and lint tools (jest, eslint, typescript-eslint),
# which only match patterns from our own config and source tree, never input
# from clients.

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
# picomatch ReDoS. No patched version exists (last_affected 4.0.7, the latest).
# Reached via jest-haste-map, jest-util, jest-message-util, chokidar@3 >
# anymatch/readdirp, and typescript-eslint/node-gyp > tinyglobby.
ignoreUntil = 2027-02-18
reason = "picomatch has no fixed release; used only by dev tools (jest, typescript-eslint) matching our own patterns and, in a production install, by node-gyp at install time; never loaded at runtime."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
# minimatch DoS. Fixed only in minimatch 11, a new major that eslint,
# typescript-eslint, glob and test-exclude do not accept yet.
ignoreUntil = 2027-02-18
reason = "minimatch fix needs major 11, not yet accepted by eslint/typescript-eslint/glob; used only by dev tools and, in a production install, by node-gyp's glob at install time; never loaded at runtime."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
# glob AbortSignal bypass. Fixed only in glob 14, a new major. Reached via
# jest 30 (@jest/reporters, jest-config, jest-runtime) and node-gyp >
# make-fetch-happen > cacache.
ignoreUntil = 2027-02-18
reason = "glob fix needs major 14, not yet accepted by jest 30 or node-gyp's cacache; used only by test tools and, in a production install, by node-gyp at install time; never loaded at runtime."
